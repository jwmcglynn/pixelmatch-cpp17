name: Coverage

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v6

    - name: Install coverage tools
      run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 cmake ninja-build

    - name: Require complete library coverage
      env:
        CXX: clang++-18
        LLVM_COV: llvm-cov-18
        LLVM_PROFDATA: llvm-profdata-18
      run: tools/coverage_llvm.sh "${RUNNER_TEMP}/pixelmatch-coverage"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ runner.temp }}/pixelmatch-coverage/coverage.dat
        flags: unittests
        fail_ci_if_error: true
        verbose: true
